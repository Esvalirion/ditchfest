<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/res/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ditchfest Signs</title>

    <!-- Default Open Graph / Twitter Card preview. Production injects per-link
         tags server-side for /map/:mapUid and /mapper/:id (see server/app.js +
         server/services/og.js); these remain the fallback for every other route
         and for local dev (served by Vite, not the Express catch-all). The
         image is relative here because the absolute origin varies per deploy;
         the server injection overrides it with an absolute URL in prod. -->
    <meta property="og:site_name" content="Ditchfest Signs" />
    <meta property="og:title" content="Ditchfest Signs" />
    <meta property="og:description" content="Community signs, ratings and leaderboards for Ditchfest maps." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/res/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ditchfest Signs" />
    <meta name="twitter:description" content="Community signs, ratings and leaderboards for Ditchfest maps." />
    <meta name="twitter:image" content="/res/og-default.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
