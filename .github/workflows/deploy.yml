name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.name }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_IMAGE: ${{ steps.img.outputs.name }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_IMAGE,GHCR_ACTOR,GHCR_TOKEN
          script: |
            cd ${{ secrets.VPS_PATH }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            grep -q "^GHCR_IMAGE=" .env \
              && sed -i "s|^GHCR_IMAGE=.*|GHCR_IMAGE=$GHCR_IMAGE|" .env \
              || echo "GHCR_IMAGE=$GHCR_IMAGE" >> .env
            docker pull "$GHCR_IMAGE"
            docker compose up -d
            echo "✓ Deploy done: $(date '+%Y-%m-%d %H:%M:%S') — image: $GHCR_IMAGE"
